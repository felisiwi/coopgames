<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>coopgames</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header>
    <h1>coopgames</h1>
    <p>Co-op games for Felix &amp; Kenny. Pick one, host it, send the link.</p>
  </header>

  <main id="game-list">
    <p id="game-list-status">Loading games&hellip;</p>
  </main>

  <script type="module">
    const listEl = document.getElementById('game-list');
    const statusEl = document.getElementById('game-list-status');

    function renderCard(game) {
      const article = document.createElement('article');
      article.className = 'game-card';

      const meta = [
        game.players ? `${game.players.min}–${game.players.max} players` : '',
        game.owner ? `by ${game.owner}` : '',
      ]
        .filter(Boolean)
        .join(' · ');

      const h2 = document.createElement('h2');
      h2.textContent = game.name;
      const p = document.createElement('p');
      p.textContent = game.description ?? '';
      const button = document.createElement('a');
      button.className = 'host-button';
      button.href = game.path;
      button.textContent = 'Host';

      article.append(h2, p);
      if (meta) {
        const metaEl = document.createElement('p');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        article.append(metaEl);
      }
      article.append(button);
      return article;
    }

    fetch('games/manifest.json')
      .then((res) => {
        if (!res.ok) throw new Error(`manifest fetch failed: ${res.status}`);
        return res.json();
      })
      .then((games) => {
        statusEl.remove();
        if (!games.length) {
          listEl.innerHTML = '<p>No games yet.</p>';
          return;
        }
        for (const game of games) listEl.appendChild(renderCard(game));
      })
      .catch((err) => {
        statusEl.textContent = 'Could not load games/manifest.json — run node scripts/manifest.js.';
        console.error(err);
      });
  </script>
</body>
</html>
