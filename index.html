<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>coopgames</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header id="hub-header">
    <h1>coopgames</h1>
    <p>Co-op games for Felix &amp; Kenny. Pick one, host it, send the link.</p>
  </header>

  <main id="lobby">
    <div id="host-start">
      <button id="host-button">Host a session</button>
    </div>

    <div id="host-link" hidden>
      <p>Send this link to your friend:</p>
      <input id="host-link-input" type="text" readonly />
      <button id="copy-link-button" disabled>Copy link</button>
      <p id="host-link-text" class="link-text"></p>
      <p class="note">Keep this tab open — refreshing it gets a new link (a new page load is a new peer id).</p>
    </div>

    <div id="connecting" hidden>
      <p id="connecting-status">Connecting to host&hellip;</p>
    </div>

    <div id="picker" hidden>
      <p id="picker-status"></p>
      <div id="game-list"></div>
    </div>

    <div id="lost" hidden>
      <p>Connection lost — host must resend a link.</p>
    </div>
  </main>

  <canvas id="game-canvas" hidden></canvas>

  <div id="waiting-overlay" hidden>
    <p>Waiting for a friend — link copied?</p>
    <button id="waiting-overlay-copy">Copy link</button>
  </div>

  <div id="launch-error" hidden>
    <p id="launch-error-text"></p>
    <button id="launch-error-back">Back to game list</button>
  </div>

  <script src="shared/vendor/peerjs.min.js"></script>
  <script type="module">
    import { host, joinFromUrl } from './shared/net.js';

    const els = {
      header: document.getElementById('hub-header'),
      lobby: document.getElementById('lobby'),
      hostStart: document.getElementById('host-start'),
      hostButton: document.getElementById('host-button'),
      hostLink: document.getElementById('host-link'),
      hostLinkInput: document.getElementById('host-link-input'),
      hostLinkText: document.getElementById('host-link-text'),
      copyButton: document.getElementById('copy-link-button'),
      connecting: document.getElementById('connecting'),
      connectingStatus: document.getElementById('connecting-status'),
      picker: document.getElementById('picker'),
      pickerStatus: document.getElementById('picker-status'),
      gameList: document.getElementById('game-list'),
      lost: document.getElementById('lost'),
      canvas: document.getElementById('game-canvas'),
      waitingOverlay: document.getElementById('waiting-overlay'),
      overlayCopyButton: document.getElementById('waiting-overlay-copy'),
      launchError: document.getElementById('launch-error'),
      launchErrorText: document.getElementById('launch-error-text'),
      launchErrorBack: document.getElementById('launch-error-back'),
    };

    const lobbyPanels = [els.hostStart, els.hostLink, els.connecting, els.picker, els.lost];
    function showOnly(panel) {
      for (const candidate of lobbyPanels) candidate.hidden = candidate !== panel;
    }

    function renderCard(game, { onPick } = {}) {
      const article = document.createElement('article');
      article.className = 'game-card';

      const meta = [
        game.players ? `${game.players.min}–${game.players.max} players` : '',
        game.owner ? `by ${game.owner}` : '',
      ].filter(Boolean).join(' · ');

      const h2 = document.createElement('h2');
      h2.textContent = game.name;
      const p = document.createElement('p');
      p.textContent = game.description ?? '';
      article.append(h2, p);

      if (meta) {
        const metaEl = document.createElement('p');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        article.append(metaEl);
      }

      if (onPick) {
        const button = document.createElement('button');
        button.className = 'host-button';
        button.textContent = 'Play';
        button.addEventListener('click', () => onPick(game));
        article.append(button);
      }

      return article;
    }

    async function loadManifest() {
      const res = await fetch('games/manifest.json');
      if (!res.ok) throw new Error(`manifest fetch failed: ${res.status}`);
      return res.json();
    }

    function showLost() {
      showOnly(els.lost);
    }

    const CONNECT_TIMEOUT_MS = 8000;
    function withTimeout(promise, ms) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), ms);
        promise.then(
          (value) => { clearTimeout(timer); resolve(value); },
          (err) => { clearTimeout(timer); reject(err); },
        );
      });
    }

    async function launchGame(game, { net, seed, role }) {
      els.header.hidden = true;
      els.lobby.hidden = true;
      els.launchError.hidden = true;
      els.canvas.hidden = false;
      els.canvas.width = window.innerWidth;
      els.canvas.height = window.innerHeight;

      try {
        const mod = await import(`./${game.path}game.js`);
        const start = mod.default;
        // await covers both a synchronous throw and a rejected promise —
        // start() isn't documented as async, but treat it as if it might be.
        await start({
          canvas: els.canvas,
          // Reduced to the documented games/README.md contract — onClose/
          // onConnect are hub-only, games never see them.
          net: { send: net.send, onMessage: net.onMessage, peerId: net.peerId, isHost: net.isHost },
          seed,
          role,
          players: game.players ?? { min: 1, max: 1 },
        });
      } catch (err) {
        console.error('[hub] game failed to start', err);
        els.canvas.hidden = true;
        els.launchErrorText.textContent = `${game.name ?? game.id ?? 'This game'} failed to start: ${err?.message ?? err}`;
        els.launchError.hidden = false;
      }
    }

    async function runHost() {
      showOnly(els.hostStart);

      els.hostButton.addEventListener('click', async () => {
        els.hostButton.disabled = true;
        els.hostButton.textContent = 'Starting…';

        let net;
        try {
          net = await host();
        } catch (err) {
          console.error(err);
          els.hostButton.disabled = false;
          els.hostButton.textContent = 'Host a session';
          alert('Could not start hosting — see console.');
          return;
        }

        const link = `${location.origin}${location.pathname}?host=${net.peerId}`;
        history.replaceState(null, '', link);
        els.hostLinkInput.value = link;
        els.hostLinkText.textContent = link;
        els.copyButton.disabled = false;
        showOnly(els.hostLink);
        net.onClose(showLost);

        // Drop-in play (Stage D): the picker no longer waits for a guest.
        // currentLaunch is the single piece of state that lets a guest
        // connecting at any later time — mid-pick or mid-game — land in the
        // same game/seed the host is already playing. onConnect is the ONLY
        // place a 'launch' message is ever sent (see net.onConnect below):
        // the pick handler just records currentLaunch and starts the game
        // locally, so a guest who was already connected when the pick
        // happened and a guest who connects later both get exactly one
        // 'launch' message, from the same code path — no double-send.
        let currentLaunch = null;

        let games = [];
        try {
          games = await loadManifest();
        } catch (err) {
          console.error(err);
          els.pickerStatus.textContent = 'Could not load games/manifest.json — run node scripts/manifest.js.';
          showOnly(els.picker);
          return;
        }

        els.pickerStatus.textContent = games.length ? 'Pick a game:' : 'No games yet.';
        els.gameList.innerHTML = '';
        for (const game of games) {
          els.gameList.appendChild(renderCard(game, {
            onPick: (picked) => {
              currentLaunch = { gameId: picked.id, seed: Math.floor(Math.random() * 1_000_000) };
              if (net.hasConnection()) net.send({ type: 'launch', ...currentLaunch });
              else els.waitingOverlay.hidden = false;
              launchGame(picked, { net, seed: currentLaunch.seed, role: 'host' });
            },
          }));
        }
        showOnly(els.picker);

        net.onConnect(() => {
          els.waitingOverlay.hidden = true;
          if (currentLaunch) net.send({ type: 'launch', ...currentLaunch });
        });
      });

      els.copyButton.addEventListener('click', () => {
        els.hostLinkInput.select();
        navigator.clipboard?.writeText(els.hostLinkInput.value).catch(() => {});
      });

      els.overlayCopyButton.addEventListener('click', () => {
        els.hostLinkInput.select();
        navigator.clipboard?.writeText(els.hostLinkInput.value).catch(() => {});
      });
    }

    async function runGuest() {
      showOnly(els.connecting);

      let net;
      try {
        net = await withTimeout(joinFromUrl(), CONNECT_TIMEOUT_MS);
      } catch (err) {
        console.error(err);
        els.connectingStatus.textContent = err?.message === 'timeout'
          ? 'Couldn’t reach host — ask them to resend the link.'
          : 'Could not connect — check the link, or ask for a new one.';
        return;
      }
      net.onClose(showLost);

      // Register onMessage() before the (async) manifest fetch, not after —
      // the host can send 'launch' the instant its onConnect fires, which
      // races this fetch. shared/net.js buffers inbound messages until a
      // listener exists, but that only helps if we register one before the
      // manifest work; if 'launch' arrives while games is still empty, hold
      // it in pendingLaunch and resolve it once the manifest is in.
      let games = [];
      let pendingLaunch = null;
      net.onMessage((msg) => {
        if (msg?.type !== 'launch') return;
        if (games.length === 0) {
          pendingLaunch = msg;
          return;
        }
        const game = games.find((g) => g.id === msg.gameId);
        if (!game) {
          console.error('[hub] launch message named an unknown game', msg);
          return;
        }
        launchGame(game, { net, seed: msg.seed, role: 'guest' });
      });

      try {
        games = await loadManifest();
      } catch (err) {
        console.error(err);
      }

      if (pendingLaunch) {
        const msg = pendingLaunch;
        pendingLaunch = null;
        const game = games.find((g) => g.id === msg.gameId);
        if (!game) {
          console.error('[hub] launch message named an unknown game', msg);
        } else {
          launchGame(game, { net, seed: msg.seed, role: 'guest' });
          return;
        }
      }

      els.pickerStatus.textContent = 'Waiting for the host to pick a game…';
      els.gameList.innerHTML = '';
      for (const game of games) els.gameList.appendChild(renderCard(game)); // read-only: no onPick
      showOnly(els.picker);
    }

    els.launchErrorBack.addEventListener('click', () => {
      els.launchError.hidden = true;
      els.waitingOverlay.hidden = true;
      els.header.hidden = false;
      els.lobby.hidden = false;
      showOnly(els.picker);
    });

    if (new URLSearchParams(location.search).get('host')) {
      runGuest();
    } else {
      runHost();
    }
  </script>
</body>
</html>
