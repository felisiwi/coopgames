<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windward World 1700 Lab</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1a24; --panel: rgba(14, 26, 36, 0.93); --line: #2c4556; --text: #e6eef2; --dim: #9db3c0;
    --accent: #6fd0d6; --on: #06222a; --sepia: #e9d9b4; --sepia-on: #3a2c17;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dim); background: var(--bg); z-index: 9; }
  #loading.err { color: #ffb4a8; white-space: pre-wrap; }

  #bar { position: fixed; z-index: 5; top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); display: flex; gap: 6px; align-items: center; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #era { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
  #era button { min-width: 74px; height: 44px; border: 0; background: none; color: var(--text); font: 600 14px system-ui, sans-serif; cursor: pointer; }
  #era button.on { background: var(--accent); color: var(--on); }
  #era button[data-era="1700"].on { background: var(--sepia); color: var(--sepia-on); }
  .btn { flex: none; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 14px system-ui, sans-serif; cursor: pointer; }
  .btn[hidden] { display: none; }
  #year { flex: 1; min-width: 0; text-align: right; color: var(--text); font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

  .plabel { position: fixed; z-index: 3; left: 0; top: 0; transform: translate(-50%, -100%); padding: 2px 8px; border-radius: 999px; background: rgba(14, 26, 36, 0.62); color: #f3ead2; font: 600 12px system-ui, sans-serif; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .plabel.uncertain { font-style: italic; }
  .plabel small { font-weight: 400; opacity: .75; margin-left: 4px; }

  #toast { position: fixed; z-index: 6; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }

  #info { position: fixed; z-index: 4; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: min(58vw, 360px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); }
  #infoHead { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; background: none; color: inherit; font: 600 13px system-ui, sans-serif; text-align: left; cursor: pointer; }
  #infoHead .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #infoBody { display: none; padding: 0 12px 12px; max-height: min(52vh, 440px); overflow: auto; font-size: 12px; color: var(--dim); }
  #info.open #infoBody { display: block; }
  #infoBody h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #infoBody ul { margin: 0; padding-left: 16px; }
  #infoBody li { margin: 2px 0; color: var(--text); }
  #infoBody li i { color: var(--dim); }

  #chart { position: fixed; inset: 0; z-index: 8; background: #ece1c9; display: none; touch-action: none; }
  #chart.on { display: block; }
  #chartCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #chartBar { position: absolute; left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; align-items: center; }
  #chartBar .btn { background: rgba(58, 44, 23, .9); color: #f3ead2; border-color: #6a5636; }
  #chartTitle { flex: 1; text-align: center; color: #3a2c17; font: 600 13px system-ui, sans-serif; line-height: 1.2; }
  #chartLegend { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); color: #3a2c17; font-size: 12px; line-height: 1.35; background: rgba(236, 225, 201, .86); border-radius: 10px; padding: 8px 10px; }
  #chartLegend b { font-weight: 700; }
  .sw { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 6px; }
  .sw.pencil { border-top: 1.5px solid rgba(78, 72, 66, .55); }
  .sw.ink { border-top: 2.5px solid #3d3226; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">loading the coast…</div>
<div id="bar">
  <div id="era" role="group" aria-label="Era"><button type="button" data-era="today">Today</button><button type="button" data-era="1700">1700</button></div>
  <button class="btn" id="chartBtn" type="button">Chart</button>
  <div id="year"></div>
</div>
<div id="labels"></div>
<div id="toast"></div>
<div id="info">
  <button id="infoHead" type="button" aria-expanded="false" aria-controls="infoBody"><span class="name" id="infoName">World 1700 Lab</span><span aria-hidden="true">▴</span></button>
  <div id="infoBody"></div>
</div>
<div id="chart" role="dialog" aria-label="Chart">
  <canvas id="chartCanvas"></canvas>
  <div id="chartBar"><button class="btn" id="chartClose" type="button">Close</button><div id="chartTitle">Your old chart, in pencil</div><button class="btn" id="chartReset" type="button">Reset ink</button></div>
  <div id="chartLegend"><span class="sw pencil"></span><b>Pencil</b>: the coast as your Today chart drew it (land outlines only).<br><span class="sw ink"></span><b>Ink</b>: the 1700 shore, where you have sailed. <span id="chartSource"></span></div>
</div>
<script type="module" src="./src/world-1700-lab.js"></script>
</body>
</html>
