<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windward Sail-feel Lab</title>
<style>
  :root { color-scheme: dark; --bg: #0e1a24; --dim: #9db3c0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #e6eef2; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dim); background: var(--bg); z-index: 9; }
  #loading.err { color: #ffb4a8; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
  #debug { position: fixed; z-index: 6; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding: 4px 8px; border-radius: 6px; background: rgba(14, 26, 36, .75); color: #bfe9ee; font: 12px/1.3 ui-monospace, monospace; pointer-events: none; white-space: pre; }
  #debug[hidden] { display: none; }
  #toast { position: fixed; z-index: 6; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 12px; background: rgba(14, 26, 36, .9); border: 1px solid #2c4556; font-size: 13px; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">loading the coast…</div>
<div id="debug" hidden></div>
<div id="toast"></div>
<script type="module" src="./src/sail-feel-lab.js"></script>
</body>
</html>
